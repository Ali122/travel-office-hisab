<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Office Hisab</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --ink:#1f2937; --muted:#6b7280;
    --green:#059669; --green-bg:#ecfdf5; --red:#dc2626; --red-bg:#fef2f2;
    --blue:#2563eb; --blue-bg:#eff6ff; --gold:#d97706; --gold-bg:#fffbeb;
    --line:#e5e7eb; --radius:14px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); font-size:16px;}
  header{background:#0f172a; color:#fff; padding:14px 16px; position:sticky; top:0; z-index:10;}
  header h1{margin:0; font-size:19px; font-weight:700;}
  header .tag{font-size:12px; color:#94a3b8; margin-top:2px;}
  .lang-btn{position:absolute; top:14px; right:95px; border:1px solid #475569; background:#1e293b; color:#fff; border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer;}
  .hints-btn{position:absolute; top:14px; right:14px; border:1px solid #475569; background:#1e293b; color:#94a3b8; border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700; cursor:pointer;}
  .ver{font-size:11px; color:#94a3b8; font-weight:400; margin-left:6px;}
  body.no-hints .hint:not(.hint-status){display:none;}
  .ver{font-size:11px; color:#94a3b8; font-weight:600; margin-left:6px;}
  nav{display:flex; overflow-x:auto; gap:6px; padding:10px 12px; background:#0f172a;}
  nav::-webkit-scrollbar{display:none;}
  nav button{flex:0 0 auto; border:none; background:#1e293b; color:#cbd5e1; padding:8px 14px; border-radius:999px; font-size:14px; font-weight:600;}
  nav button.active{background:#fff; color:#0f172a;}
  main{padding:14px 14px 90px; max-width:640px; margin:0 auto;}
  .card{background:var(--card); border-radius:var(--radius); padding:14px; margin-bottom:14px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .card h2{margin:0 0 10px; font-size:16px;}
  .row{display:flex; gap:10px; flex-wrap:wrap;}
  .row > *{flex:1; min-width:120px;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  label{display:block; font-size:13px; color:var(--muted); margin-bottom:4px; font-weight:600;}
  input,select{width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:10px; font-size:16px; background:#fff;}
  input:focus,select:focus{outline:2px solid var(--blue); border-color:var(--blue);}
  .btn{display:inline-block; border:none; border-radius:10px; padding:11px 16px; font-size:15px; font-weight:700; cursor:pointer; width:100%; margin-top:10px;}
  .btn.primary{background:var(--blue); color:#fff;}
  .btn.green{background:var(--green); color:#fff;}
  .btn.small{width:auto; padding:7px 12px; font-size:13px; margin-top:0;}
  .btn:disabled{opacity:.5;}
  .stat{border-radius:12px; padding:12px; background:var(--bg);}
  .stat .v{font-size:20px; font-weight:800; margin-top:2px;}
  .stat .t{font-size:12px; color:var(--muted); font-weight:600;}
  .pos{color:var(--green);} .neg{color:var(--red);} .blu{color:var(--blue);} .gld{color:var(--gold);}
  table{width:100%; border-collapse:collapse; font-size:14px;}
  th{text-align:left; color:var(--muted); font-size:12px; padding:6px 4px; border-bottom:1px solid var(--line);}
  td{padding:8px 4px; border-bottom:1px solid var(--line); vertical-align:top;}
  td:last-child, th:last-child{text-align:right; white-space:nowrap;}
  .del{background:var(--red-bg); color:var(--red); border:none; border-radius:8px; padding:5px 9px; font-weight:700; cursor:pointer;}
  .pill{display:inline-block; padding:3px 10px; border-radius:999px; font-size:12px; font-weight:700;}
  .pill.done{background:var(--green-bg); color:var(--green);}
  .pill.pending{background:var(--gold-bg); color:var(--gold);}
  .empty{color:var(--muted); text-align:center; padding:14px; font-size:14px;}
  .hint{font-size:12px; color:var(--muted); margin-top:8px; line-height:1.5;}
  #tkProfitHint{min-height:38px;}
  .monthbar{display:flex; gap:8px; align-items:center; margin-bottom:12px;}
  .monthbar select{flex:1;}
  .ok-msg{background:var(--green-bg); color:var(--green); border-radius:10px; padding:10px; font-size:14px; font-weight:600; margin-top:10px;}
</style>
</head>
<body>
<header>
  <h1>Travel Office Hisab <span class="ver">v1.2</span></h1>

var GAS_CODE = "function doGet(e){\n  var p = (e \u0026\u0026 e.parameter) ? e.parameter : {};\n  var want = p.ssid ? String(p.ssid).trim() : \"\";\n  var ss;\n  try{\n    ss = want ? SpreadsheetApp.openById(want) : SpreadsheetApp.getActiveSpreadsheet();\n  }catch(err){\n    return jsonOut({ok:false, gasVer:3, err:\"Spreadsheet nahi khuli (File ID check karein): \"+err, debug:{spreadsheet:\"\", ssid:want, gasVer:3}});\n  }\n  var sh = ss.getSheetByName(\"HisabData\");\n  if(!sh \u0026\u0026 !want){ sh = ss.insertSheet(\"HisabData\"); }\n  var d = sh ? sh.getRange(\"A1\").getValue() : \"\";\n  var out = {ok:true, gasVer:3, data:(d||\"\"), debug:{spreadsheet: ss.getName(), ssid: ss.getId(), requested: want, gasVer: 3, sheets: ss.getSheets().map(function(s){ return s.getName(); })}};\n  out.bookings = readSheetRows(ss, \"Daily Bookings\");\n  out.expenses = readSheetRows(ss, \"Daily Expenses\");\n  out.qarza = readSheetRows(ss, \"Qarza Tracker\");\n  out.partners = readPartners(ss);\n  out.partnersRows = readSheetRows(ss, \"PARTNERS\");\n  out.summary = readSummary(ss);\n  return jsonOut(out);\n}\n\nfunction doPost(e){\n  var p = (e \u0026\u0026 e.parameter) ? e.parameter : {};\n  var body = {};\n  try{ body = JSON.parse((e.postData \u0026\u0026 e.postData.contents) || \"{}\") || {}; }catch(err){ body = {}; }\n  var want = p.ssid ? String(p.ssid).trim() : (body.ssid ? String(body.ssid).trim() : \"\");\n  var ss;\n  try{\n    ss = want ? SpreadsheetApp.openById(want) : SpreadsheetApp.getActiveSpreadsheet();\n  }catch(err){\n    return jsonOut({ok:false, gasVer:3, err:\"Sheet write fail (File ID check karein): \"+err});\n  }\n  try{\n    var sh = ss.getSheetByName(\"HisabData\") || ss.insertSheet(\"HisabData\");\n    if(body \u0026\u0026 body.data != null) sh.getRange(\"A1\").setValue(String(body.data));\n  }catch(err){\n    return jsonOut({ok:false, gasVer:3, err:\"Sheet write fail: \"+err});\n  }\n  return jsonOut({ok:true, gasVer:3, ssid: ss.getId(), file: ss.getName()});\n}\n\nfunction jsonOut(o){\n  return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON);\n}\n\nfunction readSheetRows(ss, name){\n  try{\n    var sh = ss.getSheetByName(name); if(!sh) return [];\n    var rows = sh.getDataRange().getValues();\n    var hi = 0;\n    for(var r = 0; r \u003c Math.min(rows.length, 5); r++){\n      var line = rows[r].map(function(c){ return String(c).toLowerCase(); });\n      if(line.some(function(c){ return c.indexOf(\"date\") !== -1; })){ hi = r; break; }\n    }\n    if(rows.length \u003c hi + 2) return [];\n    var head = rows[hi];\n    return rows.slice(hi + 1).filter(function(r){ return String(r.join(\"\")) !== \"\"; }).map(function(r){\n      var o = {};\n      head.forEach(function(h, i){\n        var v = r[i];\n        if(v instanceof Date) v = Utilities.formatDate(v, Session.getScriptTimeZone(), \"yyyy-MM-dd\");\n        o[String(h).trim()] = v;\n      });\n      return o;\n    });\n  }catch(err){ return []; }\n}\n\nfunction readSummary(ss){\n  try{\n    var sh = ss.getSheetByName(\"Monthly Summary\"); if(!sh) return [];\n    var rows = sh.getDataRange().getValues();\n    var out = [];\n    for(var i = 1; i \u003c rows.length; i++){\n      var lbl = String(rows[i][0]||\"\").trim();\n      var val = rows[i][1];\n      if(lbl || (val !== \"\" \u0026\u0026 val != null)) out.push({row: i+1, label: lbl, value: (typeof val === \"number\" ? val : String(val))});\n    }\n    return out;\n  }catch(err){ return []; }\n}\n\nfunction readPartners(ss){\n  try{\n    var sh = ss.getSheetByName(\"PARTNERS\"); if(!sh) return null;\n    var h = sh.getRange(1, 2, 1, 2).getValues()[0];\n    return { A: String(h[0]||\"\").trim(), B: String(h[1]||\"\").trim() };\n  }catch(err){ return null; }\n}\n";

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(!raw) return blankState();
    var s = JSON.parse(raw);
    if(!s.settings) s.settings = blankState().settings;
    if(!s.months) s.months = {};
    if(!s.draws) s.draws = [];
    if(!s.receivables) s.receivables = [];
    if(!s.tickets) s.tickets = [];
    if(!s.bills) s.bills = [];
    if(!s.waseem) s.waseem = [];
    if(!s.charityPaid) s.charityPaid = [];
    if(!s.qarzaPayments) s.qarzaPayments = [];
    if(!s.qarzaPaid) s.qarzaPaid = [];
    ensureSettings(s);
    return s;
  }catch(e){ return blankState(); }
}
function ensureSettings(s){
  var b = blankState().settings;
  for(var k in b){ if(s.settings[k] === undefined) s.settings[k] = b[k]; }
}
var S = load();

/* Shaamil file ID helpers — read + write dono isi file par */

function withQuery(base, id, bust){
  if(!base) return "";

  if(id){ url += (url.indexOf("?") >= 0 ? "&" : "?") + "ssid=" + encodeURIComponent(id); }
  if(bust){ url += (url.indexOf("?") >= 0 ? "&" : "?") + "_t=" + Date.now(); }

function ssidWarning(j, wantId){
  if(!wantId) return "";
  var got = (j && j.debug && j.debug.ssid) ? String(j.debug.ssid) : "";
  if(!got) return "Purana deployment chal raha hai — file ID bhejne par bhi ignore ho raha hai. Apps Script mein naya code paste kar ke Deploy → New deployment banayein (Manage deployments → Edit → New version bhi kaafi hai).";
  if(got !== wantId) return "Ghalat file khuli: "+((j.debug && j.debug.spreadsheet) || got)+" — File ID dobara check karein.";
  return "";

function doPush(after){
  var url = S.settings.syncUrl; if(!url){ if(after) after(false); return; }
  setSyncStatus("Sync ho raha hai…");
  var target = sheetUrl(url, false);
  fetch(target, { method:"POST", headers:{ "Content-Type":"text/plain" }, body: JSON.stringify({ action:"save", ssid: selectedSheetId(), data: JSON.stringify(S) }) })
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(j && j.ok === false){ setSyncStatus("Sync fail — "+(j.err || "sheet ne mana kar diya"), true); if(after) after(false); return; }
      setSyncStatus("✓ Sheet mein save ho gaya ("+new Date().toLocaleTimeString()+")");
      if(after) after(true);
    })
    .catch(function(){ setSyncStatus("Sync fail — 'Test karein' se URL check karein", true); if(after) after(false); });
}
function syncPush(){
  var url = S.settings.syncUrl; if(!url) return;
  if(syncTimer) clearTimeout(syncTimer);

}
function syncPull(cb){
  var url = S.settings.syncUrl;
  if(!url){ if(cb) cb(false); return; }
  setSyncStatus("Sheet se data aa raha hai…");
  var wantId = selectedSheetId();
  fetch(sheetUrl(url, true))
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j || j.ok === false){
        setSyncStatus("✗ "+((j && j.err) || "Sheet ne sahi jawab nahi diya"), true);
        if(cb) cb(false); return;
      }
      var warn = ssidWarning(j, wantId);
      if(warn){ setSyncStatus("✗ "+warn, true); if(cb) cb(false); return; }
      try{
        var data = JSON.parse(j.data);
        if(data && data.settings){
          var remoteHas = !!(data.months && Object.keys(data.months).length) || !!(data.tickets && data.tickets.length)
                       || !!(data.draws && data.draws.length) || !!(data.receivables && data.receivables.length);
          var localHas = Object.keys(S.months || {}).length > 0 || (S.tickets && S.tickets.length > 0)
                      || (S.draws && S.draws.length > 0) || (S.receivables && S.receivables.length > 0);
          var remoteTs = Number(data.__ts) || 0;
          var localTs = Number(S.__ts) || 0;

          // Sheet par purana data hai — local naya hai to sheet ko local se update kar dein
          if(localTs > remoteTs){
            setSyncStatus("Sheet par purana data tha — aap ka naya data sheet mein bhej diya");
            doPush();
            if(cb) cb(false);
            return;
          }
          if(!remoteHas){
            if(localHas){
              setSyncStatus("Sheet khali hai — local data rakha gaya, usi ko sheet mein bheja ja raha hai");
              doPush();
            } else {
              setSyncStatus("Sheet bhi khali hai");
            }
            if(cb) cb(false);
            return;
          }
          // Remote purana ya barabar — local data ko chhedna nahi
          if(localHas && remoteTs <= localTs){
            setSyncStatus("✓ Local data naya hai — sheet se purana data nahi uthaya");
            if(cb) cb(false);
            return;
          }
          data.settings.syncUrl = S.settings.syncUrl;
          data.settings.importId = S.settings.importId || "";
          if(!data.months) data.months = {};
          if(!data.draws) data.draws = [];
          if(!data.receivables) data.receivables = [];
          if(!data.tickets) data.tickets = [];
          if(!data.bills) data.bills = [];
          if(!data.waseem) data.waseem = [];
          if(!data.charityPaid) data.charityPaid = [];
          if(!data.qarzaPayments) data.qarzaPayments = [];
          if(!data.qarzaPaid) data.qarzaPaid = [];
          S = data;
          ensureSettings(S);
          localStorage.setItem(KEY, JSON.stringify(S));
          selectedMonth = null;
          setSyncStatus("✓ Sheet ka data load ho gaya");
          if(cb) cb(true);
          return;
        }
      }catch(err){}
      setSyncStatus("Sheet mein app-data nahi mila — us file se pehle import karein", true);
      if(cb) cb(false);
    })
    .catch(function(){ setSyncStatus("Sheet se data nahi mila — 'Test karein' se URL check karein", true); if(cb) cb(false); });
}

function findKey(o, sub){

  return "";
}

function sheetNum(v){ var n = Number(String(v==null?"":v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; }
function sheetDate(v, expectMid){
  v = String(v==null?"":v).trim();
  if(!v) return "";
  var expMo = (expectMid && /^\d{4}-\d{2}$/.test(expectMid)) ? Number(expectMid.slice(5,7)) : 0;
  var m = v.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(m) return m[0];
  m = v.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){
    var a = Number(m[1]), b = Number(m[2]), y = Number(m[3]);
    if(y < 100) y += (y < 50 ? 2000 : 1900);
    var dd = a, mm = b;
    if(a > 12 && b <= 12){ dd = a; mm = b; }
    else if(b > 12 && a <= 12){ dd = b; mm = a; }
    else if(expMo && a <= 12 && b <= 12 && a !== b){
      // Dono 12 se chhote (mas: 1/3/2026) — file ke mahine se milne wala tarika chunein
      if(b === expMo){ dd = a; mm = b; }
      else if(a === expMo){ dd = b; mm = a; }
    }
    if(mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31) return y+"-"+String(mm).padStart(2,"0")+"-"+String(dd).padStart(2,"0");
  }
  var mn = {jan:1,feb:2,mar:3,apr:4,may:5,jun:6,jul:7,aug:8,sep:9,sept:9,oct:10,nov:11,dec:12};
  m = v.match(/^(\d{1,2}|[a-zA-Z]+)[\s,\-.]+(\d{1,2}|[a-zA-Z]+)[\s,\-.]+(\d{2,4})/);
  if(m){
    var n1 = /^[a-zA-Z]+$/.test(m[1]) ? mn[m[1].toLowerCase()] : null;
    var n2 = /^[a-zA-Z]+$/.test(m[2]) ? mn[m[2].toLowerCase()] : null;
    var day = (n1 != null) ? Number(m[2]) : Number(m[1]);
    var mon = (n1 != null) ? n1 : n2;
    var yr = Number(m[3]);
    if(yr < 100) yr += (yr < 50 ? 2000 : 1900);
    if(mon && mon >= 1 && mon <= 12 && day >= 1 && day <= 31) return yr+"-"+String(mon).padStart(2,"0")+"-"+String(day).padStart(2,"0");
  }
  var num = Number(v);
  if(num > 20000 && num < 60000 && num === Math.floor(num)){
    var dt = new Date(Date.UTC(1899, 11, 30) + num*86400000);
    return dt.getUTCFullYear()+"-"+String(dt.getUTCMonth()+1).padStart(2,"0")+"-"+String(dt.getUTCDate()).padStart(2,"0");
  }
  // Sirf poori date (saal ke saath) ke liye fallback — warna "1/9" jaisi kati date ghalat samajh li jati hai
  if(!/\d{4}/.test(v)) return "";
  var d = new Date(v);
  if(!isNaN(d.getTime())) return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  return "";
}
function extractFileId(v){
  v = String(v||"").trim();
  var m = v.match(/\/d\/([a-zA-Z0-9\-_]+)/);
  if(m) return m[1];
  return v;
}

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function money(n){
  n = Math.round((Number(n)||0) * 100) / 100;

}
function today(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function monthLabel(m){ var p=m.split("-"); return MONTH_NAMES[Number(p[1])-1] + " " + p[0]; }
function esc(t){ return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ================= MONTH CALCULATION ================= */
function monthCalc(mid){
  var m = S.months[mid] || {incomes:[], expenses:[], applied:false};
  var income = 0; (m.incomes||[]).forEach(function(x){ income += Number(x.amount)||0; });
  var ticketProfit = 0;
  S.tickets.forEach(function(t){ if((t.date||"").slice(0,7) === mid) ticketProfit += (Number(t.sale)||0) - (Number(t.cost)||0); });
  income += ticketProfit;
  var expenses = 0; (m.expenses||[]).forEach(function(x){ expenses += Number(x.amount)||0; });
  var abbu = 0;
  S.draws.forEach(function(d){ if(d.partner==="ABBU" && (d.date||"").slice(0,7) === mid) abbu += Number(d.amount)||0; });
  var commission = 0;
  S.tickets.forEach(function(t){ if((t.date||"").slice(0,7) === mid) commission += Number(t.commission)||0; });
  var net = income - expenses - abbu - commission;
  var charity = 0, rest = net;
  if(net > 0){
    charity = net * (Number(S.settings.charityRate)||0) / 100;
    rest = net - charity;
  }
  var loanPay = 0, split = 0;
  if(rest > 0){
    loanPay = rest * (Number(S.settings.loanRate)||0) / 100;
    split = rest - loanPay;
  }
  return { income:income, expenses:expenses, net:net, charity:charity, loanPay:loanPay, split:split, ticketProfit:ticketProfit, abbu:abbu, commission:commission,
           each:split/2, applied:!!m.applied, appliedInfo:m.appliedInfo||null };
}
function applyMonthNow(mid){
  if(!S.months[mid]) return false;
  var c = monthCalc(mid);
  if(c.applied) return false;
  if(c.net <= 0) return false; // munafa nahi — mahina bina taqseem rehta hai
  S.months[mid].applied = true;
  S.months[mid].appliedInfo = { date: today(), charity: c.charity, loan: c.loanPay, each: c.each };
  S.settings.loanBalance = Math.max(0, (Number(S.settings.loanBalance)||0) - c.loanPay);
  if(c.loanPay>0) S.qarzaPaid.push({ id:uid(), date:today(), amount:c.loanPay, note:monthLabel(mid) });
  save();
  return true;
}
function autoDistribute(){ // mahina khatam hote hi profit ka hisaab khud baantta hai
  var todayMid = today().slice(0,7);
  var done = [];
  Object.keys(S.months).sort().forEach(function(mid){
    if(mid < todayMid){
      if(applyMonthNow(mid)) done.push(mid);
    }
  });
  if(done.length){
    render();
    alert("Profit ka hisaab khud taqseem ho gaya: " + done.map(monthLabel).join(", ") + "\nSadqa, qarza aur partners ke tabs update ho gaye.");
  }
  return done;
}
function addFixesToMonth(mid){
  if(!S.months[mid]) return;
  (S.settings.fixes||[]).forEach(function(f){
    if(!f.on || !(Number(f.amount) > 0)) return;
    S.months[mid].expenses.push({ id:uid(), desc:f.label, amount:Number(f.amount), fixId:f.id });
  });
}
function refreshFixes(mid){
  var m = S.months[mid]; if(!m) return;
  m.expenses = m.expenses.filter(function(x){ return !x.fixId; });
  addFixesToMonth(mid);
  save(); render();
}

function csvVal(v){

}
function downloadReport(){
  var rows = [];

  var mids = Object.keys(S.months).sort();
  mids.forEach(function(mid){
    var m = S.months[mid];
    (m.incomes||[]).forEach(function(x){ rows.push([mid,"","Kamai",x.desc,"","","",x.amount,"",""].map(csvVal).join(",")); });
    (m.expenses||[]).forEach(function(x){ rows.push([mid,"","Kharcha",x.desc,"","","",x.amount,"",(x.fixId?"mahana fix":"")].map(csvVal).join(",")); });
  });
  S.tickets.slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); }).forEach(function(t){
    rows.push([(t.date||"").slice(0,7),t.date,"Ticket",(t.client||"")+(t.detail?" - "+t.detail:""),t.cost,t.sale,(Number(t.sale)||0)-(Number(t.cost)||0),"",(t.paid===false?"Unpaid":"Paid"),(t.commission?"Waseem comm: "+t.commission:"")].map(csvVal).join(","));
  });
  S.draws.slice().sort(function(a,b){ return (a.date||"").localeCompare(b.date||""); }).forEach(function(d){
    var k = (d.partner==="ABBU" ? "Abbu ka liya" : ("Nikasi (" + (d.partner==="A"?S.settings.partnerA:S.settings.partnerB) + ")"));
    rows.push([(d.date||"").slice(0,7),d.date,k,(d.note||""),"","","",d.amount,"",""].map(csvVal).join(","));

  (S.waseem||[]).forEach(function(w){

  (S.charityPaid||[]).forEach(function(x){

  });
  rows.push(["","","","","","","","","",""].map(csvVal).join(","));
  rows.push(["=== MAHINA KA KHULASA ===","","","","","","","","",""].map(csvVal).join(","));
  rows.push(["Mahina","","Kul kamai","Kul kharcha","Saadgi","Sadqa","Qarza (40%)","Partners ka hissa","Abbu ka liya","Waseem comm"].map(csvVal).join(","));
  mids.forEach(function(mid){
    var c = monthCalc(mid);
    rows.push([mid,"",c.income,c.expenses,c.net,c.charity,c.loanPay,c.split,c.abbu,c.commission].map(csvVal).join(","));
  });
  var blob = new Blob(["\uFEFF" + rows.join("\r\n")], {type:"text/csv;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "hisab-report-" + today() + ".csv";

function partnerBalances(){
  var earned = {A:0, B:0}, drawn = {A:0, B:0};
  Object.keys(S.months).forEach(function(mid){
    var c = monthCalc(mid);
    if(c.applied){ earned.A += c.each; earned.B += c.each; }
  });
  S.draws.forEach(function(d){ drawn[d.partner] += Number(d.amount)||0; });
  return { earned:earned, drawn:drawn,
           balA: earned.A - drawn.A, balB: earned.B - drawn.B };
}
function totals(){
  var charity=0, loanPaid=0, monthsApplied=0;
  Object.keys(S.months).forEach(function(mid){
    var c = monthCalc(mid);
    if(c.applied){ charity += c.charity; loanPaid += c.loanPay; monthsApplied++; }
  });
  var bakaya = 0;
  S.tickets.forEach(function(t){ if(t.paid === false) bakaya += Number(t.sale)||0; });
  S.receivables.forEach(function(r){
    var paid=0; (r.payments||[]).forEach(function(p){ paid+=Number(p.amount)||0; });
    bakaya += Math.max(0, (Number(r.total)||0) - paid);
  });
  var chP = 0;
  (S.charityPaid||[]).forEach(function(x){ chP += Number(x.amount)||0; });
  var qzP = 0;
  (S.qarzaPaid||[]).forEach(function(x){ qzP += Number(x.amount)||0; });
  return { charity:charity, loanPaid:loanPaid, monthsApplied:monthsApplied, bakaya:bakaya,
           charityPaid:chP, charityBaqi:Math.max(0, charity - chP), qzPaid:qzP,
           abbuTotal:(function(){ var a=0; S.draws.forEach(function(d){ if(d.partner==="ABBU") a += Number(d.amount)||0; }); return a; })(),
           waseemDena:(function(){
             var k = 0;
             S.tickets.forEach(function(t){ k += Number(t.commission)||0; });
             (S.waseem||[]).forEach(function(w){ if(w.kind === "commission") k -= Number(w.amount)||0; });
             return Math.max(0, k);
           })() };
}

/* ================= MONTHLY ================= */
var selectedMonth = null;
function monthOptions(){
  var mids = Object.keys(S.months).sort();
  var now = new Date();
  var current = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  if(mids.indexOf(current) === -1) mids.push(current);
  mids.sort();
  if(!selectedMonth) selectedMonth = mids[mids.length-1];
  if(mids.indexOf(selectedMonth) === -1) selectedMonth = mids[mids.length-1];
  return mids.map(function(m){ return '<option value="'+m+'"'+(m===selectedMonth?" selected":"")+'>'+monthLabel(m)+'</option>'; }).join("");
}

    html += '<button class="btn small" id="dedupeTickets" style="width:100%; background:var(--red); color:#fff;">Duplicate check karein</button>';

/* ================= PARTNERS ================= */
/* Mahine ke mutabiq filter — partner, Abbu, Waseem ke liye */
var monthFilter = { DASH:"all", A:"all", B:"all", ABBU:"all", WS:"all", BAK:"all" };
function filterMonths(){
  var set = {};
  Object.keys(S.months || {}).forEach(function(m){ if(m) set[m] = 1; });
  (S.tickets||[]).forEach(function(t){ var m = String(t.date||"").slice(0,7); if(/^\d{4}-\d{2}$/.test(m)) set[m] = 1; });
  (S.draws||[]).forEach(function(d){ var m = String(d.date||"").slice(0,7); if(/^\d{4}-\d{2}$/.test(m)) set[m] = 1; });
  (S.waseem||[]).forEach(function(w){ var m = String(w.date||"").slice(0,7); if(/^\d{4}-\d{2}$/.test(m)) set[m] = 1; });
  (S.receivables||[]).forEach(function(r){ var m = String(r.date||"").slice(0,7); if(/^\d{4}-\d{2}$/.test(m)) set[m] = 1; });
  return Object.keys(set).filter(function(m){ return /^\d{4}-\d{2}$/.test(m); }).sort();
}
function monthFilterCard(key, hint){
  var months = filterMonths();
  var cur = monthFilter[key] || "all";
  if(cur !== "all" && months.indexOf(cur) === -1) cur = monthFilter[key] = "all";
  var opts = '<option value="all"'+(cur==="all"?" selected":"")+'>All months (overall)</option>';
  months.forEach(function(m){
    opts += '<option value="'+m+'"'+(m===cur?" selected":"")+'>'+esc(monthLabel(m))+'</option>';
  });
  return { cur:cur, months:months,
    html: '<div class="card" style="padding-bottom:10px;"><label>Month filter</label><select id="'+key+'MonthFilter">'+opts+'</select>'
        + '<div class="hint">'+hint+'</div></div>' };
}
function viewPartner(which){
  var key = which==="pB" ? "B" : "A";
  var st = S.settings, pb = partnerBalances();
  var pname = key==="A" ? st.partnerA : st.partnerB;
  var mf = monthFilterCard(key, "Mahina chunein to sirf usi mahine ka hissa aur nikasi. <b>All months</b> par poora hisab.");

  var earned = pb.earned[key], drawn = pb.drawn[key];
  var bal = (key==="A" ? pb.balA : pb.balB);

  var rows = mf.months.map(function(mid){
    var c = monthCalc(mid), liya = 0;
    S.draws.forEach(function(d){
      if(d.partner===key && String(d.date||"").slice(0,7)===mid) liya += Number(d.amount)||0;
    });
    return { mid:mid, applied:!!c.applied, bana:(c.applied ? c.each : 0), liya:liya };
  });
  var shown = (mf.cur==="all") ? rows : rows.filter(function(r){ return r.mid===mf.cur; });
  var sB = 0, sL = 0;
  shown.forEach(function(r){ sB += r.bana; sL += r.liya; });

  var topBana  = (mf.cur==="all") ? earned : sB;
  var topLiya  = (mf.cur==="all") ? drawn  : sL;
  var topBaqi  = topBana - topLiya;

  var html = mf.html;
  html += '<div class="card"><h2>'+esc(pname)+' — '+esc(T("apnahissa"))+(mf.cur==="all"?"":' ('+esc(monthLabel(mf.cur))+')')+'</h2><div class="grid2">';
  html += '<div class="stat"><div class="t">'+esc(T("bana"))+'</div><div class="v pos">'+money(topBana)+'</div></div>';
  html += '<div class="stat"><div class="t">'+esc(T("liya"))+'</div><div class="v">'+money(topLiya)+'</div></div>';
  html += '<div class="stat"><div class="t">'+esc(T("bakayalbl"))+'</div><div class="v '+(topBaqi>=0?"pos":"neg")+'">'+money(topBaqi)+'</div></div>';
  if(mf.cur!=="all"){
    html += '<div class="stat"><div class="t">Overall baqaya (ab tak)</div><div class="v '+(bal>=0?"pos":"neg")+'">'+money(bal)+'</div></div>';
  }
  html += '</div>';
  if(mf.cur!=="all"){
    html += '<div class="hint">Overall: Bana <b>'+money(earned)+'</b> • Liya <b>'+money(drawn)+'</b> • Baqaya <b>'+money(bal)+'</b></div>';
  }
  html += '</div>';

  html += '<div class="card"><h2>Month-wise hisab</h2>';
  if(shown.length){
    html += '<table><tr><th>Mahina</th><th>Bana</th><th>Liya</th><th>Farq</th></tr>';
    shown.forEach(function(r){
      html += '<tr><td><b>'+esc(monthLabel(r.mid))+'</b>'+(r.applied?'':' <span class="pill pending">'+esc(T("append"))+'</span>')+'</td>'
            + '<td class="pos">'+(r.applied?money(r.bana):'—')+'</td>'
            + '<td>'+money(r.liya)+'</td>'
            + '<td class="'+((r.bana-r.liya)>=0?"pos":"neg")+'">'+money(r.bana-r.liya)+'</td></tr>';
    });
    html += '<tr><th>Total'+(mf.cur==="all"?"":' ('+esc(monthLabel(mf.cur))+')')+'</th><th class="pos">'+money(sB)+'</th><th>'+money(sL)+'</th><th class="'+((sB-sL)>=0?"pos":"neg")+'">'+money(sB-sL)+'</th></tr>';
    html += '</table>';
    html += '<div class="hint">Pending = us mahine ka hisab abhi apply nahi hua, is liye hissa 0 hai. Mahina khatam hone par khud apply ho jata hai.</div>';
  } else {
    html += '<div class="empty">Koi mahina nahi mila.</div>';
  }
  html += '</div>';

  html += '<div class="card"><h2>'+esc(T("nikrec"))+'</h2>';
  html += '<div class="row"><input id="drawAmt" type="number" min="0" inputmode="decimal" placeholder="'+esc(T("raqamph"))+'"><input id="drawDate" type="date" value="'+today()+'" style="max-width:160px;"></div>';
  html += '<input id="drawNote" placeholder="'+esc(T("noteph"))+'" style="margin-top:8px;">';
  html += '<button class="btn primary" id="addDraw" data-p="'+key+'">'+esc(T("savek"))+'</button></div>';

  var mine = S.draws.filter(function(d){ return d.partner===key; });
  if(mf.cur!=="all") mine = mine.filter(function(d){ return String(d.date||"").slice(0,7)===mf.cur; });
  mine.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
  if(mine.length){
    html += '<div class="card"><h2>'+esc(T("nikhist"))+(mf.cur==="all"?"":' — '+esc(monthLabel(mf.cur)))+'</h2><table><tr><th>'+esc(T("thdate"))+'</th><th>'+esc(T("thw"))+'</th><th>'+esc(T("raqamh"))+'</th><th></th></tr>';
    mine.forEach(function(d){
      html += '<tr><td>'+esc(d.date)+'</td><td>'+esc(d.note||"—")+'</td><td class="neg">'+money(d.amount)+'</td><td><button class="del" data-type="draw" data-id="'+d.id+'">✕</button></td></tr>';
    });
    html += '</table></div>';
  } else {
    html += '<div class="card"><div class="empty">'+esc(T("emptynik"))+'</div></div>';
  }
  return html;
}

/* ================= WASEEM (STAFF) ================= */
function viewWaseem(){
  var mf = monthFilterCard("WS", "Mahina chunein to us mahine ki commission/salary. <b>All months</b> par poora record.");
  var kam = 0, diya = 0, sal = 0;
  S.tickets.forEach(function(t){ kam += Number(t.commission)||0; });
  (S.waseem||[]).forEach(function(w){
    if(w.kind === "commission") diya += Number(w.amount)||0;
    else sal += Number(w.amount)||0;
  });
  var rows = mf.months.map(function(mid){
    var bana = 0, dada = 0, sala = 0;
    S.tickets.forEach(function(t){ if(String(t.date||"").slice(0,7)===mid) bana += Number(t.commission)||0; });
    (S.waseem||[]).forEach(function(w){
      if(String(w.date||"").slice(0,7)!==mid) return;
      if(w.kind === "commission") dada += Number(w.amount)||0; else sala += Number(w.amount)||0;
    });
    return { mid:mid, bana:bana, dada:dada, sala:sala };
  });
  var shown = (mf.cur==="all") ? rows : rows.filter(function(r){ return r.mid===mf.cur; });
  var sB = 0, sD = 0, sS = 0;
  shown.forEach(function(r){ sB += r.bana; sD += r.dada; sS += r.sala; });
  var topKam = (mf.cur==="all") ? kam : sB;
  var topDiya = (mf.cur==="all") ? diya : sD;
  var topSal = (mf.cur==="all") ? sal : sS;
  var topBaq = topKam - topDiya;
  var mine = (S.waseem||[]).slice();
  if(mf.cur!=="all") mine = mine.filter(function(w){ return String(w.date||"").slice(0,7)===mf.cur; });
  mine.sort(function(a,b){ return (b.date||"").localeCompare(a.date||""); });
  var html = mf.html;
  html += '<div class="card"><h2>'+esc(T("wsh2"))+(mf.cur==="all"?"":' — '+esc(monthLabel(mf.cur)))+'</h2><div class="grid2">';
  html += '<div class="stat"><div class="t">'+esc(T("wsbana"))+'</div><div class="v pos">'+money(topKam)+'</div></div>';
  html += '<div class="stat"><div class="t">'+esc(T("wsdiya"))+'</div><div class="v">'+money(topDiya)+'</div></div>';
  html += '<div class="stat"><div class="t">'+esc(T("wsbaq2"))+'</div><div class="v '+(topBaq>=0?"pos":"neg")+'">'+money(topBaq)+'</div></div>';
  html += '<div class="stat"><div class="t">'+esc(T("saldi"))+'</div><div class="v">'+money(topSal)+'</div></div>';
  html += '</div>';
  if(mf.cur!=="all"){
    html += '<div class="hint">Overall: Commission bana <b>'+money(kam)+'</b> • Diya <b>'+money(diya)+'</b> • Baqaya <b>'+money(kam-diya)+'</b> • Salary <b>'+money(sal)+'</b></div>';
  }
  html += '</div>';

  html += '<div class="card"><h2>Month-wise hisab</h2>';
  if(shown.length){
    html += '<table><tr><th>Mahina</th><th>Commission bana</th><th>Diya</th><th>Baqaya</th><th>Salary</th></tr>';
    shown.forEach(function(r){
      html += '<tr><td><b>'+esc(monthLabel(r.mid))+'</b></td>'
            + '<td class="pos">'+money(r.bana)+'</td>'
            + '<td>'+money(r.dada)+'</td>'
            + '<td class="'+((r.bana-r.dada)>=0?"pos":"neg")+'">'+money(r.bana-r.dada)+'</td>'
            + '<td>'+money(r.sala)+'</td></tr>';
    });
    html += '<tr><th>Total'+(mf.cur==="all"?"":' ('+esc(monthLabel(mf.cur))+')')+'</th><th class="pos">'+money(sB)+'</th><th>'+money(sD)+'</th><th class="'+((sB-sD)>=0?"pos":"neg")+'">'+money(sB-sD)+'</th><th>'+money(sS)+'</th></tr></table>';
  } else {
    html += '<div class="empty">Koi mahina nahi mila.</div>';
  }
  html += '</div>';

  html += '<div class="card"><h2>'+esc(T("payrec"))+'</h2>';
  html += '<div class="row"><select id="wsKind" style="max-width:200px;"><option value="commission">'+esc(T("kcomm"))+'</option><option value="salary">'+esc(T("ksal"))+'</option></select><input id="wsAmt" type="number" min="0" inputmode="decimal" placeholder="'+esc(T("raqamph"))+'"><input id="wsDate" type="date" value="'+today()+'" style="max-width:160px;"></div>';
  html += '<input id="wsNote" placeholder="'+esc(T("wsnote"))+'" style="margin-top:8px;">';
  html += '<button class="btn primary" id="addWs">'+esc(T("savek"))+'</button></div>';

  if(mine.length){
    html += '<div class="card"><h2>'+esc(T("payhist"))+(mf.cur==="all"?"":' — '+esc(monthLabel(mf.cur)))+'</h2><table><tr><th>'+esc(T("thdate"))+'</th><th>'+esc(T("thkism"))+'</th><th>'+esc(T("thw"))+'</th><th>'+esc(T("raqamh"))+'</th><th></th></tr>';
    mine.forEach(function(w){
      html += '<tr><td>'+esc(w.date)+'</td><td>'+esc(w.kind === "commission" ? T("kcomm") : T("ksal"))+'</td><td>'+esc(w.note||"—")+'</td><td class="neg">'+money(w.amount)+'</td><td><button class="del" data-type="waseem" data-id="'+w.id+'">✕</button></td></tr>';

/* ================= EVENTS ================= */
function bind(){
  var app = document.getElementById("app");

  var sel = document.getElementById("monthSel");
  if(sel) sel.onchange = function(){ selectedMonth = sel.value; render(); };

  var tmf = document.getElementById("tkMonthFilter");
  if(tmf) tmf.onchange = function(){ ticketFilter = tmf.value; render(); };

  ["DASH","A","B","ABBU","WS","BAK"].forEach(function(k){
    var fm = document.getElementById(k+"MonthFilter");
    if(fm) fm.onchange = function(){ monthFilter[k] = fm.value; render(); };
  });

  var addM = document.getElementById("addMonth");
  if(addM) addM.onclick = function(){
    downloadBackup(); // naya mahina shuru hone se pehle apne aap backup
    autoDistribute(); // pichhle mahine ka profit hisaab khud baant do
    var d = new Date(), i = d.getMonth(), y = d.getFullYear();
    // pehli khali mahina dhoondein (current se aage)
    var mid;
    for(var k=0;k<24;k++){
      var m2 = i+k, y2 = y + Math.floor(m2/12);
      mid = y2+"-"+String((m2%12)+1).padStart(2,"0");
      if(!S.months[mid]) break;
    }
    S.months[mid] = { incomes:[], expenses:[], applied:false };
    addFixesToMonth(mid);
    save(); selectedMonth = mid; render();
  };

  var delM = document.getElementById("delMonth");
  if(delM) delM.onclick = function(){
    var mid = selectedMonth;
    if(!mid) return;
    var m = S.months[mid];
    if(!m){ alert(monthLabel(mid)+" mein koi data nahi hai."); return; }
    var ne = (m.expenses||[]).length, ni = (m.incomes||[]).length;
    if(!confirm(monthLabel(mid)+" ka mahina delete karein?\n\nKamai: "+ni+" — Kharche: "+ne+"\n\n(Tickets alag hote hain, wo nahi delete honge. Ghalat import kiye gaye mahine ko hatane ke liye ye istemal karein.)")) return;
    delete S.months[mid];
    selectedMonth = null;
    save(); render();
  };

  var expShift = document.getElementById("expShift");
  if(expShift) expShift.onclick = function(){
    var from = (document.getElementById("expFrom")||{}).value;
    var to = (document.getElementById("expTo")||{}).value;
    if(!from || !to) return;
    if(from === to){ alert("'Se' aur 'Mein' mahina alag chunein."); return; }
    if(!S.months[from]) return;
    var mv = (S.months[from].expenses||[]).slice();
    if(!mv.length){ alert(monthLabel(from)+" mein koi kharcha nahi hai."); return; }
    var tot = mv.reduce(function(a,b){ return a + (Number(b.amount)||0); }, 0);
    if(!confirm(monthLabel(from)+" ke "+mv.length+" kharche ("+money(tot)+") "+monthLabel(to)+" mein shift karein?")) return;
    if(!S.months[to]) S.months[to] = { incomes:[], expenses:[], applied:false };
    S.months[to].expenses = (S.months[to].expenses||[]).concat(mv);
    S.months[from].expenses = [];
    save(); selectedMonth = to; render();
  };

  function addItem(type){
    var dEl = document.getElementById(type==="income"?"inDesc":"exDesc");
    var aEl = document.getElementById(type==="income"?"inAmt":"exAmt");
    var desc = dEl.value.trim(), amt = Number(aEl.value);
    if(!desc || !(amt>0)) return;
    if(!S.months[selectedMonth]) S.months[selectedMonth] = { incomes:[], expenses:[], applied:false };
    S.months[selectedMonth][type==="income"?"incomes":"expenses"].push({ id:uid(), desc:desc, amount:amt });
    save(); render();
  }
  var ai = document.getElementById("addIncome"); if(ai) ai.onclick = function(){ addItem("income"); };
  var ae = document.getElementById("addExpense"); if(ae) ae.onclick = function(){ addItem("expense"); };
  var ia = document.getElementById("inAmt"); if(ia) ia.onkeydown = function(e){ if(e.key==="Enter") addItem("income"); };
  var ea = document.getElementById("exAmt"); if(ea) ea.onkeydown = function(e){ if(e.key==="Enter") addItem("expense"); };

  app.querySelectorAll(".del[data-type='income'], .del[data-type='expense']").forEach(function(b){
    b.onclick = function(){
      var type = b.getAttribute("data-type") === "income" ? "incomes" : "expenses";
      var i = Number(b.getAttribute("data-i"));
      S.months[selectedMonth][type].splice(i,1);
      save(); render();
    };
  });

  var ap = document.getElementById("applyMonth");
  if(ap) ap.onclick = function(){
    if(applyMonthNow(selectedMonth)) render();
  };

  app.querySelectorAll(".del[data-type='draw']").forEach(function(b){
    b.onclick = function(){
      S.draws = S.draws.filter(function(d){ return d.id !== b.getAttribute("data-id"); });
      save(); render();
    };
  });
  var ad = document.getElementById("addDraw");
  if(ad) ad.onclick = function(){
    var amt = Number(document.getElementById("drawAmt").value);
    if(!(amt>0)) return;
    var dd = document.getElementById("drawDate").value || today();
    S.draws.push({ id:uid(), partner:ad.getAttribute("data-p")||"A", amount:amt,
                   note:(document.getElementById("drawNote")||{}).value||"",
                   date:dd });
    monthFilter[ad.getAttribute("data-p")||"A"] = String(dd).slice(0,7); // nayi entry foran nazar aaye
    save(); render();
  };
  var ab = document.getElementById("addAbbu");
  if(ab) ab.onclick = function(){
    var amt = Number(document.getElementById("abbuAmt").value);
    if(!(amt>0)) return;
    var dd = document.getElementById("abbuDate").value || today();
    S.draws.push({ id:uid(), partner:"ABBU", amount:amt,
                   note:(document.getElementById("abbuNote")||{}).value||"",
                   date:dd });
    monthFilter.ABBU = String(dd).slice(0,7);
    save(); render();
  };

  var arv = document.getElementById("addRv");
  if(arv) arv.onclick = function(){
    var name = document.getElementById("rvClient").value.trim();
    var total = Number(document.getElementById("rvTotal").value);
    if(!name || !(total>0)) return;
    var dd = (document.getElementById("rvDate")||{}).value || today();
    S.receivables.push({ id:uid(), client:name, note:document.getElementById("rvNote").value.trim(), total:total, date:dd, payments:[] });
    monthFilter.BAK = String(dd).slice(0,7);
    save(); render();
  };
  app.querySelectorAll(".rv-paybtn").forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-id");
      var r = S.receivables.find(function(x){ return x.id===id; }); if(!r) return;
      var amtEl = app.querySelector(".rv-pay[data-id='"+id+"']");
      var dateEl = app.querySelector(".rv-date[data-id='"+id+"']");
      var amt = Number(amtEl.value);
      if(!(amt>0)) return;
      r.payments.push({ amount:amt, date:dateEl.value || today() });
      save(); render();
    };
  });
  app.querySelectorAll(".del[data-type='receivable']").forEach(function(b){
    b.onclick = function(){
      if(!confirm("Ye client entry delete karein?")) return;
      S.receivables = S.receivables.filter(function(x){ return x.id !== b.getAttribute("data-id"); });
      save(); render();
    };
  });

  var tcs = document.getElementById("tkCost"), tsa = document.getElementById("tkSale");
  function updTickHint(){
    var hint = document.getElementById("tkProfitHint");
    if(!hint) return;
    var p = (Number(tsa && tsa.value)||0) - (Number(tcs && tcs.value)||0);
    hint.innerHTML = 'Profit: <b>'+money(p)+'</b>'+(p<0?' <span style="color:var(--red);">(ghata)</span>':'');
  }
  if(tcs) tcs.oninput = updTickHint;
  if(tsa) tsa.oninput = updTickHint;
  var at = document.getElementById("addTicket");
  if(at) at.onclick = function(){
    var client = document.getElementById("tkClient").value.trim();
    var cost = Number(document.getElementById("tkCost").value) || 0;
    var sale = Number(document.getElementById("tkSale").value) || 0;
    if(!client || !(sale>0 || cost>0)){ alert("Client ka naam aur kam az kam ek raqam (cost ya sale) zaroori hai."); return; }
    var tkDate = document.getElementById("tkDate").value || today();
    S.tickets.push({ id:uid(), date:tkDate, client:client,
                     detail:document.getElementById("tkDetail").value.trim(), cost:cost, sale:sale,
                     paid:(document.getElementById("tkPaid").value === "unpaid" ? false : true),
                     commission:Number(document.getElementById("tkComm").value) || 0 });
    ticketFilter = String(tkDate).slice(0,7); // naya ticket foran nazar aaye
    save(); render();
  };
  app.querySelectorAll(".del[data-type='ticket']").forEach(function(b){
    b.onclick = function(){
      S.tickets = S.tickets.filter(function(t){ return t.id !== b.getAttribute("data-id"); });
      save(); render();
    };
  });
  app.querySelectorAll(".tk-datedit").forEach(function(b){
    b.onclick = function(){
      var id = b.getAttribute("data-id");
      var tk = (S.tickets||[]).filter(function(x){ return x.id === id; })[0];
      if(!tk) return;
      var ans = prompt("Ticket ki tareekh theek karein (mas: 2026-02-05)\n\nClient: "+(tk.client||"")+"\nAbhi ki tareekh: "+(tk.date||"?"), tk.date||"");
      if(ans == null) return;
      var nd = sheetDate(ans, "");
      if(!/^\d{4}-\d{2}-\d{2}$/.test(nd)){ alert("Tareekh samajh nahi aayi. Mas: 2026-02-05"); return; }
      tk.date = nd;
      ticketFilter = nd.slice(0,7);
      save(); render();
    };
  });
  var tkShift = document.getElementById("tkShift");
  if(tkShift) tkShift.onclick = function(){
    var from = (document.getElementById("tkFrom")||{}).value;
    var to = (document.getElementById("tkTo")||{}).value;
    if(!from || !to) return;
    if(from === to){ alert("Alag mahine chunein."); return; }
    var mv = (S.tickets||[]).filter(function(t){ return String(t.date||"").slice(0,7) === from; });
    if(!mv.length){ alert(monthLabel(from)+" mein koi ticket nahi."); return; }
    if(!confirm(monthLabel(from)+" ke "+mv.length+" tickets "+monthLabel(to)+" mein shift karein?\n\n(Din wahi rahega: mas 05 Jan → 05 Feb)")) return;
    var maxD = new Date(Number(to.slice(0,4)), Number(to.slice(5,7)), 0).getDate();
    mv.forEach(function(t){
      var day = Number(String(t.date||"").slice(8,10)) || 1;
      if(day > maxD) day = maxD;
      t.date = to + "-" + String(day).padStart(2,"0");
    });
    ticketFilter = to;
    save(); render();
  };
  var ddT = document.getElementById("dedupeTickets");
  if(ddT) ddT.onclick = function(){
    var seen = {}, rm = [];
    (S.tickets||[]).slice().sort(function(a,b){ return String(a.date||"").localeCompare(String(b.date||"")); }).forEach(function(t){
      var k = String(t.client||"").trim().toLowerCase()+"|"+Number(t.cost)+"|"+Number(t.sale);
      if(seen[k]) rm.push(t.id); else seen[k] = 1;
    });
    if(!rm.length){ alert("Koi duplicate ticket nahi mila."); return; }
    if(!confirm(rm.length+" duplicate tickets mile (same client + same cost/sale).\n\nPurani tareekh wala rakha jayega, baqi hat jayenge. Hata dein?")) return;
    S.tickets = S.tickets.filter(function(t){ return rm.indexOf(t.id) === -1; });
    save(); render();
  };
  var ctk = document.getElementById("clearTickets");
  if(ctk) ctk.onclick = function(){
    if(!S.tickets.length){ alert("Koi ticket nahi hai."); return; }
    if(confirm("Saari tickets ("+S.tickets.length+") delete hon gi — manual wali bhi. Theek hai?") &&
       confirm("Pakka? Dobara import karna chahte hain?")){
      S.tickets = [];
      save(); render();
    }
  };

  var ss = document.getElementById("saveSettings");
  if(ss) ss.onclick = function(){
    S.settings.partnerA = document.getElementById("setA").value.trim() || "Partner 1";
    S.settings.partnerB = document.getElementById("setB").value.trim() || "Partner 2";
    S.settings.charityRate = Number(document.getElementById("setCharity").value) || 0;
    S.settings.loanRate = Number(document.getElementById("setLoan").value);
    if(isNaN(S.settings.loanRate) || S.settings.loanRate < 0) S.settings.loanRate = 40;
    S.settings.loanBalance = Number(document.getElementById("setLoanBal").value) || 0;
    app.querySelectorAll("[data-f-id]").forEach(function(el){
      var id = el.getAttribute("data-f-id");
      var f = (S.settings.fixes||[]).filter(function(x){ return x.id === id; })[0];
      if(!f) return;
      if(el.classList.contains("f-label")) f.label = el.value.trim() || f.label;
      else if(el.classList.contains("f-amt")) f.amount = Number(el.value) || 0;
      else if(el.type === "checkbox") f.on = el.checked;
    });
    var prevId = extractFileId(S.settings.importId || "");
    var prevUrl = String(S.settings.syncUrl || "");
    S.settings.syncUrl = document.getElementById("setSyncUrl").value.trim();
    S.settings.importId = document.getElementById("setImportId").value.trim();
    var newId = extractFileId(S.settings.importId || "");
    var changedFile = (newId !== prevId) || (S.settings.syncUrl !== prevUrl);
    if(changedFile){
      // Nayi file chuni gayi — pehle purana data us par na likhein, seedha wahan se data laayein
      saveLocal(); render();
      var m1 = "Settings save ho gayi.";
      m1 += newId ? ("\n\nRead/Write file ID: "+newId) : "\n\nFile ID khali hai — script jis file mein deploy hai usi se data aayega.";
      if(!S.settings.syncUrl){ alert(m1); return; }
      alert(m1);
      if(!confirm("Ab isi file se data laayein?\n\nHaan = Sheet se data lao (recommended)\nCancel = abhi nahi (baad mein 'Sheet se data lao' dabayein)")){
        setSyncStatus("File ID save ho gayi — 'Sheet se data lao' dabayein", true);
        return;
      }
      syncPull(function(){ render(); });
      return;
    }
    save(); render(); alert("Settings save ho gayi." + (S.settings.syncUrl ? "\nAb data Google Sheet mein sync hoga." : ""));
  };

  var fx = document.getElementById("fixBtn");
  if(fx) fx.onclick = function(){
    if(confirm("Is mahine ke auto fix kharche (rent, tanker waghera) settings ke mutabiq dobara judenge. Theek hai?")){
      refreshFixes(selectedMonth);
    }
  };
  app.querySelectorAll(".bill-paid").forEach(function(b){
    b.onclick = function(){
      var x = (S.bills||[]).filter(function(y){ return y.id === b.getAttribute("data-id"); })[0];
      if(!x) return;
      x.paid = true;
      save(); render();
    };
  });
  app.querySelectorAll(".bill-del").forEach(function(b){
    b.onclick = function(){
      S.bills = (S.bills||[]).filter(function(y){ return y.id !== b.getAttribute("data-id"); });
      save(); render();
    };
  });
  var afx = document.getElementById("addFix");
  if(afx) afx.onclick = function(){
    var lbl = prompt("Fix kharche ka naam? (mas: Generator fuel)");
    if(!lbl) return;
    var amt = prompt("Mahana raqam (Rs)?", "0");
    S.settings.fixes.push({ id:uid(), label:lbl.trim(), amount:Number(amt)||0, on:true });
    save(); render();
  };
  app.querySelectorAll(".tk-toggle").forEach(function(b){
    b.onclick = function(){
      var t = S.tickets.filter(function(x){ return x.id === b.getAttribute("data-id"); })[0];
      if(!t) return;
      t.paid = true;
      save(); render();
    };
  });

  var aw = document.getElementById("addWs");
  if(aw) aw.onclick = function(){
    var amt = Number(document.getElementById("wsAmt").value);
    if(!(amt>0)) return;
    var dd = document.getElementById("wsDate").value || today();
    S.waseem.push({ id:uid(), date:dd,
                    kind:document.getElementById("wsKind").value,
                    note:document.getElementById("wsNote").value.trim(), amount:amt });
    monthFilter.WS = String(dd).slice(0,7);
    save(); render();
  };
  app.querySelectorAll(".del[data-type='waseem']").forEach(function(b){
    b.onclick = function(){
      S.waseem = S.waseem.filter(function(w){ return w.id !== b.getAttribute("data-id"); });
      save(); render();
    };
  });
  var ach = document.getElementById("addCh");
  if(ach) ach.onclick = function(){
    var amt = Number(document.getElementById("chAmt").value);
    if(!(amt>0)) return;
    S.charityPaid.push({ id:uid(), date:document.getElementById("chDate").value || today(), amount:amt, note:document.getElementById("chNote").value.trim() });
    save(); render();
  };
  app.querySelectorAll(".del[data-type='charity']").forEach(function(b){
    b.onclick = function(){
      S.charityPaid = S.charityPaid.filter(function(y){ return y.id !== b.getAttribute("data-id"); });
      save(); render();
    };
  });
  var aq = document.getElementById("addQz");
  if(aq) aq.onclick = function(){
    var amt = Number(document.getElementById("qzAmt").value);
    if(!(amt>0)) return;
    S.qarzaPaid.push({ id:uid(), date:document.getElementById("qzDate").value || today(), amount:amt, note:document.getElementById("qzNote").value.trim() });
    S.settings.loanBalance = Math.max(0, (Number(S.settings.loanBalance)||0) - amt);
    save(); render();
  };
  app.querySelectorAll(".del[data-type='qz']").forEach(function(b){
    b.onclick = function(){
      var x = (S.qarzaPaid||[]).filter(function(y){ return y.id === b.getAttribute("data-id"); })[0];
      if(!x) return;
      if(confirm("Ye payment record hatana hai? (Qarza balance wapis barh jayega)")){
        S.settings.loanBalance = (Number(S.settings.loanBalance)||0) + (Number(x.amount)||0);
        S.qarzaPaid = S.qarzaPaid.filter(function(y){ return y.id !== x.id; });
        save(); render();
      }
    };
  });

  var ex = document.getElementById("exportData");
  if(ex) ex.onclick = function(){
    downloadBackup();
    alert("Backup download ho gayi — is file ko sambhal kar rakhein (Google Drive ya USB mein).");
  };
  var bn = document.getElementById("backupNow");
  if(bn) bn.onclick = function(){
    downloadBackup();
    alert("Backup download ho gayi — sambhal kar rakhein.");
  };
  var rb = document.getElementById("repBtn");
  if(rb) rb.onclick = function(){
    downloadReport();
  };
  var ps = document.getElementById("pullSync");
  if(ps) ps.onclick = function(){
    var u = document.getElementById("setSyncUrl").value.trim();
    var iid = document.getElementById("setImportId");
    S.settings.syncUrl = u;
    if(iid) S.settings.importId = iid.value.trim();
    saveLocal();
    if(!u){ alert("Pehle sync URL daalein."); return; }
    syncPull(function(ok){ if(ok) save(); render(); });
  };
  var tst = document.getElementById("testSync");
  if(tst) tst.onclick = testSync;
  var ish = document.getElementById("importSheet");
  if(ish) ish.onclick = function(){
    var u = document.getElementById("setSyncUrl"), iid = document.getElementById("setImportId");
    if(u) S.settings.syncUrl = u.value.trim();
    if(iid) S.settings.importId = iid.value.trim();
    saveLocal();
    importFromSheet();
  };
  var cg = document.getElementById("copyGas");
  if(cg) cg.onclick = function(){
    var ta = document.getElementById("gasCode");
    ta.select();
    try{ document.execCommand("copy"); alert("Code copy ho gaya — Apps Script editor mein paste karein."); }
    catch(e){ alert("Text select kar ke manually copy karein."); }
  };
  var cs = document.getElementById("copyShare");
  if(cs) cs.onclick = function(){
    var site = location.origin + location.pathname;
    var link = site + "?sync=" + encodeURIComponent(S.settings.syncUrl || "");
    var sid = selectedSheetId();
    if(sid) link += "&ssid=" + encodeURIComponent(sid);
    if(!S.settings.syncUrl) alert("Sync URL abhi khali hai — link mein sirf app hoga, sync setup nahi.");
    var ta = document.createElement("textarea");
    ta.value = link;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); alert("Link copy ho gaya! Ye WhatsApp par bhej dein — kholte hi us ke mobile par sync setup ho jayega."); }
    catch(e){ window.prompt("Ye link copy karein:", link); }
    document.body.removeChild(ta);
  };
  var im = document.getElementById("importData");
  if(im) im.onchange = function(){
    var f = im.files[0]; if(!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try{
        var data = JSON.parse(reader.result);
        if(!data.settings) throw new Error("galat file");
        S = data; if(!S.months) S.months = {};
        if(!S.draws) S.draws = []; if(!S.receivables) S.receivables = []; if(!S.tickets) S.tickets = [];
        ensureSettings(S);
        if(!S.bills) S.bills = [];
        if(!S.waseem) S.waseem = [];
        if(!S.charityPaid) S.charityPaid = [];
        if(!S.qarzaPayments) S.qarzaPayments = [];
        if(!S.qarzaPaid) S.qarzaPaid = [];
        save(); selectedMonth = null; render(); alert("Backup wapas aa gaya.");
      }catch(e){ alert("Ye file theek nahi hai. Sirf backup file chunein."); }
    };
    reader.readAsText(f);
  };
  var ra = document.getElementById("resetAll");
  if(ra) ra.onclick = function(){
    if(confirm("SACH MEIN poora data delete karein?\n\n(Ye Google Sheet par save hua data bhi delete kar dega — backup pehle le lein!)")){
      if(confirm("Aakhri tasdeeq: sab record khatam hoga aur sheet bhi khali ho jayegi.")){
        var keepUrl = S.settings.syncUrl, keepId = S.settings.importId;
        S = blankState();
        S.settings.syncUrl = keepUrl;      // connection settings barqarar
        S.settings.importId = keepId;
        S.__ts = Date.now();
        saveLocal(); selectedMonth = null; render();
        setSyncStatus("Sheet se bhi data delete kiya ja raha hai…");
        doPush(function(ok){
          alert(ok
            ? "✓ Local data aur Google Sheet ka data — dono delete ho gaye.\n\nAb sirf EK mahine ki file import karein."
            : "Local data delete ho gaya, magar Google Sheet par data abhi bhi hai.\nInternet / sync URL check karein, warna purana data wapas aa sakta hai.");
        });
      }
    }
  };
}

render();
autoDistribute();
if(S.settings.syncUrl) syncPull(function(){ render(); autoDistribute(); });
// Jab app dobara khole / tab par wapas aaye — sheet se taaza data khud aa jaye
document.addEventListener("visibilitychange", function(){
  if(document.hidden || !S.settings.syncUrl) return;
  var el = document.activeElement;
  var typing = el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.tagName === "SELECT");
  if(!typing) syncPull(function(){ render(); });
});
var hintsB = document.getElementById("hintsBtn");
if(hintsB) hintsB.onclick = function(){
  S.settings.hints = (S.settings.hints === false) ? true : false;
  save(); render();
};
</script>
</body>
</html>
